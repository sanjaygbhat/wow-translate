name: Build & Package WoWTranslate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      working-directory: dll
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A Win32

    - name: Build DLL
      working-directory: dll/build
      run: cmake --build . --config Release

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: WoWTranslate-dll
        path: dll/build/bin/Release/WoWTranslate.dll
        if-no-files-found: error

    - name: Create Release Package
      run: |
        mkdir WoWTranslate
        copy dll\build\bin\Release\WoWTranslate.dll WoWTranslate\
        xcopy Interface\AddOns\WoWTranslate WoWTranslate\Interface\AddOns\WoWTranslate\ /E /I /Q
        echo WoWTranslate Installation> WoWTranslate\INSTALL.txt
        echo =========================>> WoWTranslate\INSTALL.txt
        echo.>> WoWTranslate\INSTALL.txt
        echo 1. Copy WoWTranslate.dll to your WoW folder (next to WoW.exe)>> WoWTranslate\INSTALL.txt
        echo 2. Add "WoWTranslate.dll" to dlls.txt in your WoW folder>> WoWTranslate\INSTALL.txt
        echo 3. Copy the Interface folder to your WoW folder>> WoWTranslate\INSTALL.txt
        echo 4. Launch WoW, then type: /wt provider google>> WoWTranslate\INSTALL.txt
        echo 5. Type: /wt googlekey YOUR_GOOGLE_CLOUD_TRANSLATION_API_KEY>> WoWTranslate\INSTALL.txt
        echo 6. Test with: /wt test YOUR_TEXT>> WoWTranslate\INSTALL.txt
        echo.>> WoWTranslate\INSTALL.txt
        echo For help: /wt show>> WoWTranslate\INSTALL.txt
      shell: cmd

    - name: Upload Package
      uses: actions/upload-artifact@v4
      with:
        name: WoWTranslate-v${{ github.run_number }}
        path: WoWTranslate/
        if-no-files-found: error

    - name: Create Release ZIP
      run: |
        Compress-Archive -Path WoWTranslate/* -DestinationPath WoWTranslate-2.0-${{ github.run_number }}.zip
      shell: pwsh

    - name: Upload Release ZIP
      uses: actions/upload-artifact@v4
      with:
        name: WoWTranslate-release-zip
        path: WoWTranslate-2.0-${{ github.run_number }}.zip
        if-no-files-found: error

    - name: Publish Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: WoWTranslate-2.0-${{ github.run_number }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
